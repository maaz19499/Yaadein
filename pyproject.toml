[project]
name = "yaadein"
version = "0.1.0"
description = "AI-powered event photo and video sharing platform backend"
authors = [
    {name = "Antigravity IDE", email = "antigravity-ide@gemini.google"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy[mypy]>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "pydantic-settings>=2.2.1",
    "boto3>=1.34.69",
    "pillow>=10.2.0",
    "imagehash>=4.3.1",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "pyjwt[crypto]>=2.8.0"
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "pytest-asyncio>=0.23.5"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_decorators = false
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "imagehash.*",
    "pgvector.*",
    "pgvector",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"

