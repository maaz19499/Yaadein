version: "3.8"

services:
  api:
    build:
      context: .
      target: api
    container_name: yaadein-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    container_name: yaadein-worker
    env_file:
      - .env
    restart: unless-stopped
