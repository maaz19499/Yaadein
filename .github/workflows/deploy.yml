name: Deploy to AWS EC2 via CodeDeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Application
        run: |
          zip -r deployment.zip . -x ".git/*" ".venv/*" "__pycache__/*" "*.pytest_cache/*" "*.mypy_cache/*" "*.ruff_cache/*"

      - name: Upload to AWS S3
        run: |
          aws s3 cp deployment.zip s3://${{ secrets.S3_BUCKET }}/deployments/yaadein-${{ github.sha }}.zip

      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=deployments/yaadein-${{ github.sha }}.zip,bundleType=zip \
            --description "Deployment for commit ${{ github.sha }}"
